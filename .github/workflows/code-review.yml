name: code-review

# Advisory Claude review of every non-draft PR. Not a required check; it never
# gates a merge. Adapted from project-saturn's code-review.yml, with the round cap
# and anti-repeat rules from dozer-api / dozer-stream.
#
# The action refuses to run when this file differs from the copy on the default
# branch -- a prompt-injection guard, since a PR could otherwise rewrite its own
# reviewer. Expect the claude job to skip green on any PR that edits this file,
# including the one that adds it. It starts reviewing once merged.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**.rst'
      - '**.bat'
      - 'scripts/windows/**'
  # Escape hatch: force a review round from the Actions tab once the cap below has
  # been reached, or for a PR opened before this workflow existed.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  # Required even with claude_code_oauth_token: the action exchanges a GitHub OIDC
  # token regardless, and fails with "Could not fetch an OIDC token" without it.
  id-token: write

# A three-commit push fires `synchronize` three times; without this each one
# starts its own billed review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# Rounds 1-3 surface the real findings; later rounds are mostly polish and
# rehashes. Each round posts one claude[bot] summary comment, and those are what
# is counted. workflow_dispatch bypasses the cap.
env:
  MAX_AUTOMATIC_ROUNDS: "3"

jobs:
  budget:
    # Drafts are for watching CI, not for review; `ready_for_review` picks the PR
    # up when it is marked ready. Bot PRs are mechanical and get no review.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.budget.outputs.should_run }}
      pr_number: ${{ steps.budget.outputs.pr_number }}
    steps:
      - id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # One line per comment, so the count is right across pages.
          comments() {
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                  --jq ".[] | select($1) | .id" | wc -l
          }
          prior=$(comments '.user.login == "claude[bot]"')
          echo "prior review rounds: $prior (cap $MAX_AUTOMATIC_ROUNDS)"
          if [ "$prior" -lt "$MAX_AUTOMATIC_ROUNDS" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          echo "should_run=false" >> "$GITHUB_OUTPUT"

          # Say so once; the sentinel keeps later pushes from repeating it.
          sentinel="<!-- claude-review-cap-reached -->"
          if [ "$(comments ".body | contains(\"$sentinel\")")" -eq 0 ]; then
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/code-review.yml"
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" -b "$sentinel
          Claude has reviewed this PR $MAX_AUTOMATIC_ROUNDS times and will not run again on later pushes. To force another round, run [code-review]($url) from the Actions tab with PR number $PR."
          fi

  claude:
    needs: budget
    if: needs.budget.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A workflow_dispatch run starts on the default branch; review the PR's head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.budget.outputs.pr_number }}

            Review this pull request. The repository is Dozer's fork of Stereolabs'
            zed-gstreamer: C++ GStreamer elements (zedsrc, zedxonesrc, zeddemux,
            zeddatamux, ...) on the ZED SDK, used by the base station on Jetson
            Orin NX with ZED-X cameras over GMSL.

            You cannot build or test this tree: the ZED SDK and the Jetson toolchain
            are not available here. Review statically. Do not ask for build or test
            output.

            Prioritise, in order:

            1. GStreamer element correctness -- buffer and metadata lifetime, caps
               negotiation, EOS and flush handling, state-change ordering
               (NULL/READY/PAUSED/PLAYING) and their error paths.
            2. ZED SDK camera lifetime -- open/close pairing, grab-thread shutdown,
               and behaviour when a camera fails to open or drops mid-stream. A bad
               camera must surface as an error, not hang the pipeline.
            3. Property compatibility -- the base station sets these elements'
               properties by name. Flag any renamed or removed property, or a changed
               default, as breaking for that consumer.
            4. Upstream divergence -- prefer changes that keep a later merge from
               Stereolabs' upstream tractable; flag gratuitous churn in untouched code.
            5. Shell scripts -- numeric vs lexicographic comparison, unquoted
               expansions, missing shebangs.

            Before drafting anything, read this PR's earlier review rounds:
            `gh pr view <PR NUMBER> --comments` for the summaries, and
            `gh api repos/<REPO>/pulls/<PR NUMBER>/comments` for the inline threads.

            - Do not re-raise a concern the author has answered. A reply pointing at
              a test, a file or an explanation closes it, even if a fresh read of
              the code would raise it again.
            - If there are already two or more claude[bot] summary comments, report
              only new correctness defects in the latest push. No polish.
            - Keep a finding only if it is a real defect, it is introduced or still
              unresolved by the latest push, and no earlier thread covers it.
              Posting zero findings is a good outcome.

            Report only defects you can point at in the diff, with the failure they
            cause. If a file is clean, say nothing about it. Use inline comments for
            specific lines. Then ALWAYS post exactly one summary comment with
            `gh pr comment <PR NUMBER> -R <REPO> -b "..."`, holding anything
            structural; with nothing to report it says "No new findings on this
            round." Nobody sees your final message, only the PR comments.
          claude_args: |
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ needs.budget.outputs.pr_number }}/comments:*)"
